services:
  my-database:
    image: postgres:15.0
    environment:
      - POSTGRES_PASSWORD=db_password
      - POSTGRES_DB=myDB
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myDB"]
      interval: 5s
      timeout: 5s
      retries: 5

  broker:
    build:
      context: .
      args:
        APP_NAME: broker
    ports:
      - "8080:8080"
    environment:
      - DB_DSN=host=my-database port=5432 user=postgres password=db_password dbname=myDB sslmode=disable
    depends_on:
      my-database:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        APP_NAME: worker
    environment:
      - BROKER_URL=http://broker:8080
    depends_on:
      - broker

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - broker

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
